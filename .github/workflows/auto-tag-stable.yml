---
name: Auto-tag Stable

on:
  push:
    branches:
      - main
    paths:
      - ha_opencode/config.yaml
  # A GITHUB_TOKEN push cannot start another workflow. Reconcile periodically
  # so a future non-triggering metadata update cannot leave Home Assistant
  # advertising a version whose container image was never published.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: auto-tag-stable
  cancel-in-progress: false

jobs:
  auto-tag:
    name: Create stable release tag
    runs-on: ubuntu-latest
    steps:
      - name: Detect sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is required to create release tags that trigger downstream workflows."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Create or reconcile stable release tag
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RECONCILE_MISSING_TAG: ${{ github.event_name != 'push' }}
        run: bash scripts/auto-tag-stable.sh
