---
name: Upstream Sync

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch: {}

permissions:
  # The sync commit must use SYNC_TOKEN, not GITHUB_TOKEN: GitHub deliberately
  # suppresses push-triggered workflows created by GITHUB_TOKEN.  The push must
  # therefore be attributable to the release token so Auto-tag Stable creates
  # the tag that starts the image build.
  contents: read
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync from magnusoverli/opencode
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://github.com/magnusoverli/opencode.git
      # Files whose conflicts are resolved by taking upstream's version and
      # re-running scripts/apply-plus.sh.
      MANAGED_FILES: |
        ha_opencode/config.yaml
        ha_opencode_beta/config.yaml
        ha_opencode/Dockerfile
        ha_opencode/rootfs/etc/s6-overlay/s6-rc.d/ha-opencode/run
        ha_opencode/rootfs/etc/s6-overlay/s6-rc.d/ha-openchamber/run
        README.md
        repository.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Verify release token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is required: upstream sync commits must trigger Auto-tag Stable."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name 'upstream-sync[bot]'
          git config user.email 'upstream-sync@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Up to date with upstream."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream without committing
        id: merge
        if: steps.check.outputs.new == 'true'
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if git merge upstream/main --no-commit --no-ff; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicted="$(git diff --name-only --diff-filter=U)"
          unmanaged=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if grep -qxF "$file" <<< "$MANAGED_FILES"; then
              git checkout --theirs -- "$file"
              git add -- "$file"
            elif [[ "$file" == .github/workflows/* ]]; then
              # Workflow files contain fork-specific registry and release
              # behavior. Keep this fork's version during conflict resolution.
              if git cat-file -e "HEAD:$file" 2>/dev/null; then
                git checkout HEAD -- "$file"
              else
                git rm -f --quiet -- "$file"
              fi
            else
              unmanaged="$unmanaged $file"
            fi
          done <<< "$conflicted"

          if [ -n "$unmanaged" ]; then
            echo "Unmanaged merge conflicts:$unmanaged"
            git merge --abort
            echo "result=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "result=clean" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Preserve fork workflow files
        if: steps.check.outputs.new == 'true' && steps.merge.outputs.result == 'clean'
        env:
          BASE: ${{ steps.merge.outputs.base }}
        run: |
          changed="$(git diff --name-only --cached "$BASE" -- .github/workflows)"
          if [ -z "$changed" ]; then
            echo "Merge brings no workflow changes."
            exit 0
          fi

          echo "Preserving fork workflow files instead of mirroring upstream:"
          echo "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if git cat-file -e "$BASE:$file" 2>/dev/null; then
              git checkout "$BASE" -- "$file"
            else
              git rm -f --quiet -- "$file"
            fi
          done <<< "$changed"

      - name: Re-apply plus overlay and push
        if: steps.check.outputs.new == 'true' && steps.merge.outputs.result == 'clean'
        run: |
          bash scripts/apply-plus.sh
          git add -A

          version="$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' ha_opencode/config.yaml | head -1)"
          git commit --allow-empty -m "chore: sync upstream, re-apply plus overlay (v$version)"
          git push origin HEAD:main

      - name: Open issue for manual conflict resolution
        if: steps.check.outputs.new == 'true' && steps.merge.outputs.result == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync needs manual conflict resolution"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)"
          if [ "$existing" != "0" ]; then
            echo "Issue already open"
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --body "Automatic merge of upstream $UPSTREAM hit conflicts outside overlay-managed files. Resolve manually with git fetch upstream main, git merge upstream/main, bash scripts/apply-plus.sh, then commit and push."
